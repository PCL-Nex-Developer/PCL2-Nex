name: Cross-Platform Build (Reusable)

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      tag:
        description: 'release tag to attach artifacts (empty = upload as workflow artifacts only)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref to build'
        default: 'dev'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    strategy:
      matrix:
        include:
          # linux 单 job：一次构建出 deb + AppImage + rpm（同一 staging 打三种包）
          - { os: ubuntu-latest, platform: linux }
          - { os: macos-14,     platform: osx-x64 }
          - { os: macos-14,     platform: osx-arm64 }
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve BaseVersion
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ "$tag" == v* ]]; then
            base_version="${tag#v}"
          elif [[ -z "$tag" || "$GITHUB_REF_TYPE" != "tag" ]]; then
            base_version="2026.07.1"
          else
            echo "Release tag must use vyyyy.MM.patch format." >&2
            exit 1
          fi
          if [[ ! "$base_version" =~ ^[1-9][0-9]{3}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid BaseVersion parsed from release tag: $base_version" >&2
            exit 1
          fi
          echo "BUILD_VERSION=$base_version" >> "$GITHUB_ENV"

      - name: Install packaging tools (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build
        shell: bash
        env:
          PRIVATE_FEED_TOKEN: ${{ secrets.FEED_TOKEN_RO }}
          RuntimeIdentifier: ${{ matrix.platform == 'linux' && 'linux-x64' || matrix.platform }}
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          set +x
          echo "${{ secrets.BUILD_SCRIPT_B64 }}" | base64 -d > /tmp/build.sh
          bash /tmp/build.sh ${{ matrix.platform }} 2>/tmp/build.err || {
            echo "::error::build failed"
            tail -40 /tmp/build.err || true
            exit 1
          }
          rm -f /tmp/build.sh /tmp/build.err

      - name: Verify Linux SQLite runtime asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t packages < <(find dist -type f -name '*.deb' -print)
          if (( ${#packages[@]} == 0 )); then
            echo 'No Debian package was produced.' >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if ! dpkg-deb --contents "$package" | awk '{print $NF}' | grep -qx './usr/lib/pcl2/libe_sqlite3.so'; then
              echo "Missing libe_sqlite3.so in $package" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: cross-${{ matrix.platform }}
          path: dist/**

  attach-release:
    if: ${{ inputs.tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: cross-*
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" artifacts/* --clobber
