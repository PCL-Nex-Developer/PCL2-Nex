name: Build (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      tag:
        description: Release tag used to resolve the build version
        required: false
        type: string
        default: ''
      publish_release:
        description: Publish each matrix build directly to the GitHub Release
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: ubuntu-latest
            kind: windows
            platform: x64
            runtime: win-x64
          - name: Windows ARM64
            os: ubuntu-latest
            kind: windows
            platform: ARM64
            runtime: win-arm64
          - name: Linux x64
            os: ubuntu-latest
            kind: cross-platform
            platform: linux
            runtime: linux-x64
          - name: macOS x64
            os: macos-15-intel
            kind: cross-platform
            platform: osx-x64
            runtime: osx-x64
          - name: macOS ARM64
            os: macos-15
            kind: cross-platform
            platform: osx-arm64
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve BaseVersion
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ "$tag" == v* ]]; then
            base_version="${tag#v}"
          elif [[ -z "$tag" || "$GITHUB_REF_TYPE" != "tag" ]]; then
            base_version="2026.07.1"
          else
            echo "Release tag must use vyyyy.MM.patch format." >&2
            exit 1
          fi
          if [[ ! "$base_version" =~ ^[1-9][0-9]{3}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid BaseVersion parsed from release tag: $base_version" >&2
            exit 1
          fi
          echo "BUILD_VERSION=$base_version" >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install packaging tools (rpm)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Windows
        if: matrix.kind == 'windows'
        shell: bash
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
          -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ matrix.platform }} \
          -p:BaseVersion="$BUILD_VERSION" \
          -p:DeleteExistingFiles=true -o ./artifact --no-self-contained

      - name: Build Linux or macOS
        if: matrix.kind == 'cross-platform'
        shell: bash
        env:
          BUILD_SCRIPT_B64: ${{ secrets.BUILD_SCRIPT_B64 }}
          PRIVATE_FEED_TOKEN: ${{ secrets.FEED_TOKEN_RO }}
          RuntimeIdentifier: ${{ matrix.runtime }}
          AppendRuntimeIdentifierToOutputPath: 'false'
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          set +x
          script_path="$(mktemp)"
          error_path="$(mktemp)"
          trap 'rm -f "$script_path" "$error_path"' EXIT
          printf '%s' "$BUILD_SCRIPT_B64" | base64 -d > "$script_path"
          bash "$script_path" ${{ matrix.platform }} 2>"$error_path" || {
            echo "::error::build failed"
            tail -40 "$error_path" || true
            exit 1
          }

      - name: Verify removed plugin runtimes are absent
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          mapfile -t forbidden < <(find ./artifact -type f \( \
            -iname 'Jint.dll' -o \
            -iname 'Acornima.dll' -o \
            -iname 'PCL.Plugin.Abstractions.dll' -o \
            -iname 'PCL.Mixin.dll' \
          \))
          if (( ${#forbidden[@]} > 0 )); then
            printf 'Forbidden legacy/plugin runtime artifact: %s\n' "${forbidden[@]}" >&2
            exit 1
          fi

      - name: Verify Linux SQLite runtime asset
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mapfile -t packages < <(find dist -type f -name '*.deb' -print)
          if (( ${#packages[@]} == 0 )); then
            echo 'No Debian package was produced.' >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if ! dpkg-deb --contents "$package" | awk '{print $NF}' | grep -qx './usr/lib/pcl2/libe_sqlite3.so'; then
              echo "Missing libe_sqlite3.so in $package" >&2
              exit 1
            fi
          done

      - name: Normalize release filenames
        shell: bash
        env:
          BUILD_KIND: ${{ matrix.kind }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
          BUILD_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          found=0

          if [[ "$BUILD_KIND" == 'windows' ]]; then
            source='./artifact/Plain Craft Launcher 2.exe'
            target="artifact/PCL2_Nex_${BUILD_CONFIGURATION}_${BUILD_RUNTIME}.exe"
            if [[ ! -s "$source" ]]; then
              echo "Windows release executable is missing: $source" >&2
              exit 1
            fi
            mv "$source" "$target"
            found=1
          else
            while IFS= read -r -d '' package; do
              case "$package" in
                *.deb) extension=deb ;;
                *.rpm) extension=rpm ;;
                *.AppImage) extension=AppImage ;;
                *.dmg) extension=dmg ;;
                *) continue ;;
              esac
              target="artifact/PCL2_Nex_${BUILD_CONFIGURATION}_${BUILD_RUNTIME}.${extension}"
              if [[ -e "$target" ]]; then
                echo "Multiple packages resolve to the same release filename: $target" >&2
                exit 1
              fi
              mv "$package" "$target"
              found=1
            done < <(find dist -type f -print0)
          fi

          if (( found == 0 )); then
            echo 'No supported release package was produced.' >&2
            exit 1
          fi

      - name: Import GPG key
        if: inputs.publish_release
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign release artifacts
        if: inputs.publish_release
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' asset; do
            gpg --batch --yes --detach-sign --armor "$asset"
            found=1
          done < <(find artifact -maxdepth 1 -type f -name 'PCL2_Nex_*' ! -name '*.asc' -print0)
          if (( found == 0 )); then
            echo 'No normalized release artifact was found to sign.' >&2
            exit 1
          fi

      - name: Upload build directly to GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ inputs.tag }}
          files: artifact/PCL2_Nex_*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload CI artifact
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v7
        with:
          name: PCL2_Nex_${{ inputs.configuration }}_${{ matrix.runtime }}
          path: artifact/**
          if-no-files-found: error
