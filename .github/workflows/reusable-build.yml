name: Build (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      architecture:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve BaseVersion
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ "$tag" == v* ]]; then
            base_version="${tag#v}"
          elif [[ -z "$tag" || "$GITHUB_REF_TYPE" != "tag" ]]; then
            base_version="2026.07.1"
          else
            echo "Release tag must use vyyyy.MM.patch format." >&2
            exit 1
          fi
          if [[ ! "$base_version" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid BaseVersion parsed from release tag: $base_version" >&2
            exit 1
          fi
          echo "base_version=$base_version" >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Project
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
          -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.architecture }} \
          -p:BaseVersion="$base_version" \
          -p:DeleteExistingFiles=true -o ./artifact --no-self-contained

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL2_Nex_${{ inputs.configuration }}_${{ inputs.architecture }}
          path: artifact/**
