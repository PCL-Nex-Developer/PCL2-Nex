name: Build (CI)

permissions:
  contents: read

on:
  push:
    branches: [dev]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  test:
    name: Test PCL.Core
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run plugin, version and network contract tests
        run: >-
          dotnet test "PCL.Core.Test/PCL.Core.Test.csproj" -c Debug
          --filter "(FullyQualifiedName~PCL.Core.Test.App.Plugins)|(FullyQualifiedName~LauncherBaseVersionTest)|(FullyQualifiedName~UriSchemeServiceTest)|(FullyQualifiedName~GitHubAcceleratorTest)"

  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: CI
    secrets: inherit
