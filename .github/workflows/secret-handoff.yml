name: One-time ModelScope secret handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    if: github.actor == 'XueL1ng'
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt secret for Nex_Server
        shell: bash
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          TARGET_PUBLIC_KEY: NertxVKlke5H3sU0PwWHRjhQEdE3eHFWrkkET93ThA0=
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN"
          python -m pip install --disable-pip-version-check pynacl==1.6.2
          encrypted_value="$(python - <<'PY'
          import base64
          import os

          from nacl.public import PublicKey, SealedBox

          public_key = PublicKey(base64.b64decode(os.environ["TARGET_PUBLIC_KEY"]))
          encrypted = SealedBox(public_key).encrypt(os.environ["MODELSCOPE_TOKEN"].encode())
          print(base64.b64encode(encrypted).decode())
          PY
          )"
          printf 'ENCRYPTED_VALUE=%s\n' "$encrypted_value"
