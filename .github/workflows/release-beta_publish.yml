name: Publish (Beta)

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ github.event.release.prerelease }}
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: Beta
      tag: ${{ github.event.release.tag_name }}
      publish_release: true
    secrets: inherit

  finalize_release:
    name: Finalize release and ModelScope mirror
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: ${{ github.event.release.prerelease }}
    steps:
      - name: Checkout all
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
        continue-on-error: true

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md
        continue-on-error: true

      - name: Add changelog to release
        if: ${{ hashFiles('CHANGELOG.md') != '' }}
        uses: softprops/action-gh-release@v2.5.0
        continue-on-error: true
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror release to ModelScope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_CONFIGURATION: Beta
        run: |
          bash .github/scripts/mirror-modelscope-release.sh

