name: Publish (Beta)

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ github.event.release.prerelease }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: Beta
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  changelog:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ github.event.release.prerelease }}
    steps:
      - name: Checkout all
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md

      - name: Add changelog to release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    permissions:
      contents: write
      actions: write
    needs: [build, changelog]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: Beta
            architecture: x64
            runtime: win-x64
          - configuration: Beta
            architecture: ARM64
            runtime: win-arm64
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL2_Nex_${{ matrix.configuration }}_${{ matrix.runtime }}
          path: ./artifact

      - name: Rename binaries
        run: |
          mv "./artifact/Plain Craft Launcher 2.exe" "PCL2_Nex_${{ matrix.configuration }}_${{ matrix.runtime }}.exe"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign the binary
        run: |
          gpg --detach-sign --armor "PCL2_Nex_${{ matrix.configuration }}_${{ matrix.runtime }}.exe"

      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: |
            PCL2_Nex_${{ matrix.configuration }}_${{ matrix.runtime }}.exe
            PCL2_Nex_${{ matrix.configuration }}_${{ matrix.runtime }}.exe.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_cross_platform:
    if: ${{ github.event.release.prerelease }}
    permissions:
      contents: write
      actions: read
    needs: [build, rename_and_release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror script
        uses: actions/checkout@v6

      - name: Download Linux Build Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          pattern: PCL2_Nex_Beta_linux-*
          merge-multiple: true

      - name: Download macOS Build Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          pattern: PCL2_Nex_Beta_osx-*
          merge-multiple: true

      - name: Upload Linux and macOS Builds to Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            artifacts/PCL2_Nex_Beta_linux-*
            artifacts/PCL2_Nex_Beta_osx-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror release to ModelScope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_CONFIGURATION: Beta
        run: |
          bash .github/scripts/mirror-modelscope-release.sh

